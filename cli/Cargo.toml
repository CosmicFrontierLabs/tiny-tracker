[package]
name = "cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "action-tracker-cli"
path = "src/main.rs"

[dependencies]
shared = { path = "../shared" }

# Database
diesel = { version = "2", features = ["postgres", "chrono"] }
dotenvy = "0.15"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP (commands that talk to a running server)
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

# CSV
csv = "1"

# Error handling
anyhow = "1"

# Reset SIGPIPE so `action-tracker-cli ... | head` exits quietly
libc = "0.2"
